<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>União Solar - Performance Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.3); }
        }
        .animate-gold { animation: pulse-gold 3s infinite ease-in-out; }
        
        .slide-up { animation: slideUp 0.8s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-solar-dark {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .ai-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen">

    <div id="app" class="relative min-h-screen bg-solar-dark flex flex-col items-center justify-start p-4 md:p-8 pb-40">
        
        <!-- Cabeçalho -->
        <div class="w-full flex flex-col items-center z-30 slide-up mb-8">
            <div class="p-2 rounded-2xl max-w-[280px] md:max-w-[420px]">
                <!-- Tenta carregar a logo local, senão usa um placeholder visual -->
                <img src="logo-texto-branco.png" alt="União Solar Logo" onerror="this.src='https://via.placeholder.com/400x100/1e293b/f97316?text=UNIAO+SOLAR'" class="w-full h-auto object-contain filter drop-shadow-lg">
            </div>
            <div class="mt-4 flex items-center space-x-3 bg-orange-600 text-white px-6 py-1.5 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-xl">
                <span>Alegre</span>
                <span class="opacity-50">•</span>
                <span>Guaçuí</span>
                <span class="opacity-50">•</span>
                <span>Região</span>
            </div>
        </div>

        <!-- Mensagens Dinâmicas -->
        <div id="step-container" class="text-center max-w-4xl z-10 mb-12 min-h-[160px] transition-opacity duration-500">
            <h1 id="main-title" class="text-4xl md:text-7xl font-black mb-4 text-white leading-tight text-glow">
                SUA USINA ESTÁ <br><span class="text-orange-500">PERDENDO DINHEIRO?</span>
            </h1>
            <p id="sub-title" class="text-lg md:text-2xl font-light text-slate-300 max-w-2xl mx-auto italic">
                A sujidade invisível pode reduzir o seu lucro em até <span class="text-orange-500 font-bold border-b-2 border-orange-500">30%</span>.
            </p>
        </div>

        <!-- Painel de IA -->
        <div class="w-full max-w-5xl z-20 slide-up grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 ai-card p-8 rounded-[2.5rem] shadow-2xl">
                <div class="flex items-center space-x-2 mb-6">
                    <span class="text-2xl animate-pulse">✨</span>
                    <h3 class="font-bold text-orange-500 uppercase text-sm tracking-widest">Consultoria IA</h3>
                </div>
                <textarea id="ai-input" rows="4" class="w-full bg-slate-900/50 p-4 rounded-2xl border border-slate-700 focus:border-orange-500 focus:outline-none transition-all text-white text-sm mb-6" placeholder="Ex: Minha usina em Alegre está gerando menos que o normal..."></textarea>
                
                <div class="space-y-4">
                    <button onclick="runFeature('analyze')" id="btn-analyze" class="w-full bg-white text-slate-950 text-xs font-black py-4 rounded-xl hover:bg-orange-500 hover:text-white transition-all flex items-center justify-center space-x-2 uppercase">
                        <span>Análise de Eficiência ✨</span>
                    </button>
                    <button onclick="runFeature('report')" id="btn-report" class="w-full bg-orange-600 text-white text-xs font-black py-4 rounded-xl hover:bg-orange-700 transition-all flex items-center justify-center space-x-2 uppercase">
                        <span>Gerar Relatório Técnico ✨</span>
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 ai-card p-8 rounded-[2.5rem] shadow-2xl flex flex-col relative">
                <div id="ai-loading" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-md z-10 flex items-center justify-center rounded-[2.5rem]">
                    <div class="flex flex-col items-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-orange-500 mb-4"></div>
                        <span class="text-xs font-bold text-orange-500 uppercase tracking-[0.3em]">IA Processando...</span>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mb-6">
                    <h4 id="response-title" class="font-bold text-slate-500 uppercase text-[10px] tracking-[0.2em]">Resultado União Solar IA</h4>
                    <button onclick="copyResponse()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg text-[10px] font-bold text-orange-500 transition-colors">COPIAR</button>
                </div>
                
                <div id="ai-output" class="text-sm md:text-lg text-slate-200 leading-relaxed custom-scrollbar overflow-y-auto flex-grow min-h-[280px]">
                    <div class="flex flex-col items-center justify-center h-full text-center text-slate-500">
                        <p class="max-w-xs italic opacity-40">Aguardando detalhes para gerar o diagnóstico técnico.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- WhatsApp Floating CTA -->
        <div class="fixed bottom-8 left-0 right-0 flex justify-center px-6 z-40">
            <a href="https://wa.me/5528998850813" target="_blank" class="bg-gradient-to-r from-green-600 to-green-500 text-white px-10 py-5 rounded-2xl shadow-2xl hover:scale-105 transition-transform flex items-center space-x-4">
                <div class="flex flex-col text-left">
                    <span class="text-[10px] font-black uppercase tracking-wider opacity-90">Falar no WhatsApp</span>
                    <span class="text-xl md:text-2xl font-black">(28) 99885-0813</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        // Lógica de Alternância de Títulos (Marketing)
        const scenes = [
            { t: "SUA USINA ESTÁ <br><span class='text-orange-500'>PERDENDO DINHEIRO?</span>", s: "A sujidade invisível reduz o seu lucro em até 30%." },
            { t: "QUALIDADE QUE <br><span class='text-blue-400'>GERA RESULTADO</span>", s: "Manutenção técnica em Alegre, Guaçuí e toda a região." }
        ];
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % scenes.length;
            const cont = document.getElementById('step-container');
            if(cont) {
                cont.style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('main-title').innerHTML = scenes[idx].t;
                    document.getElementById('sub-title').innerHTML = scenes[idx].s;
                    cont.style.opacity = 1;
                }, 500);
            }
        }, 5000);

        // --- INTEGRAÇÃO COM GOOGLE GEMINI AI ---
        // Usando a nova chave fornecida pelo utilizador
        const apiKey = "AIzaSyAF0CDF1kEhwokhuF39TwJh_rufPjdbbBs"; 
        
        const modelList = [
            "gemini-1.5-flash",
            "gemini-pro"
        ];

        const prompts = {
            analyze: (input) => `Aja como o Especialista Técnico Chefe da União Solar de Alegre/ES. Analise este caso: "${input}". Explique tecnicamente por que a manutenção profissional e a limpeza são cruciais para o rendimento. Seja profissional, mas direto. Termine convidando para o contacto (28) 99885-0813.`,
            report: (input) => `Gere um Relatório de Viabilidade e Performance para: "${input}". Use os tópicos: [DIAGNÓSTICO INICIAL], [RISCOS DETETADOS] e [RECOMENDAÇÃO UNIÃO SOLAR].`
        };

        async function runFeature(type) {
            const input = document.getElementById('ai-input').value;
            const output = document.getElementById('ai-output');
            const loading = document.getElementById('ai-loading');
            const resTitle = document.getElementById('response-title');

            if (!input.trim()) {
                output.innerHTML = "<p class='text-orange-500'>Por favor, introduza detalhes da sua usina ou as suas dúvidas.</p>";
                return;
            }

            loading.classList.remove('hidden');
            resTitle.innerText = "PROCESSANDO DIAGNÓSTICO...";

            let success = false;
            let lastError = "";

            // Tenta os modelos em sequência caso um falhe por falta de permissão ou sobrecarga
            for (const modelName of modelList) {
                if (success) break;
                
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompts[type](input) }] }]
                        })
                    });

                    const data = await response.json();

                    // Validação robusta da resposta
                    if (data && data.candidates && data.candidates && data.candidates.content) {
                        const text = data.candidates.content.parts.text;
                        output.innerHTML = `<div class="bg-slate-900/60 p-6 rounded-2xl border border-orange-500/30 text-slate-100 leading-relaxed">${text.replace(/\n/g, '<br>')}</div>`;
                        resTitle.innerText = "RESULTADO DO CONSULTOR IA";
                        success = true;
                    } else if (data.error) {
                        lastError = data.error.message;
                        console.warn(`Tentativa com ${modelName} falhou: ${lastError}`);
                    }
                } catch (e) {
                    console.error("Erro de comunicação com o servidor de IA.");
                }
            }

            if (!success) {
                output.innerHTML = `
                    <div class="text-center p-6 bg-slate-900/40 rounded-2xl border border-red-500/20">
                        <p class='text-orange-500 font-bold mb-3 uppercase tracking-wider'>Chave em Processamento</p>
                        <p class='text-xs text-slate-400 leading-relaxed mb-4'>
                            A sua nova chave foi inserida, mas o Google pode demorar alguns minutos para ativá-la totalmente. 
                            Certifique-se de que aceitou os termos no Google AI Studio.
                        </p>
                        <p class='text-[9px] text-slate-600 mb-6 italic'>Log: ${lastError}</p>
                        <button onclick="location.reload()" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg text-xs uppercase tracking-widest">
                            Tentar Novamente
                        </button>
                    </div>
                `;
            }
            
            loading.classList.add('hidden');
        }

        function copyResponse() {
            const text = document.getElementById('ai-output').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            // Notificação simples sem alert()
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "COPIADO!";
            btn.classList.add("bg-orange-500", "text-white");
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove("bg-orange-500", "text-white");
            }, 2000);
        }
    </script>
</body>
</html>
